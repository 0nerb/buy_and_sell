appId: com.brenokern.recomendacao
productName: Recomendação
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
mac:
  category: public.app-category.finance
  target:
    - target: dmg
      arch: [arm64, x64]
  # Sem certificado Apple por enquanto: o app não é assinado/notarizado.
  identity: null
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
publish: null
